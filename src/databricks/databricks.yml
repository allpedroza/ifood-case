bundle:
  name: ifood-case
  engine: direct

include:
  - resources/*.yml

sync:
  paths:
    - ..
    - .

variables:
  catalog:
    description: Catálogo existente no Unity Catalog do workspace Free (obrigatório)
    default: case_ifood
  landing_schema:
    description: Schema da área de landing
    default: tlc_data_landing
  bronze_schema:
    description: Schema das tabelas Bronze
    default: tlc_data_bronze
  silver_schema:
    description: Schema das tabelas Silver
    default: tlc_data_silver
  gold_schema:
    description: Schema das tabelas Gold
    default: tlc_data_gold
  quality_schema:
    description: Schema de regras e resultados de qualidade de dados
    default: tlc_data_quality
  sql_warehouse_id:
    description: SQL Warehouse usado pelo dashboard de qualidade
  volume_name:
    description: Volume gerenciado para os Parquets originais
    default: nyc_tlc_landing

targets:
  free:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
