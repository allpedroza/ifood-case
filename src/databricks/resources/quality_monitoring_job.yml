resources:
  jobs:
    quality_monitoring:
      name: job_monitoramento_qualidade_nyc_tlc
      description: >-
        Avalia as regras governadas de qualidade nas camadas Landing, Bronze,
        Silver e Gold após cada atualização da carga da NYC TLC.
      max_concurrent_runs: 1

      tasks:
        - task_key: avaliar_qualidade
          spark_python_task:
            python_file: ../../quality/evaluate_quality.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --landing-path
              - /Volumes/${var.catalog}/${resources.schemas.landing.name}/${resources.volumes.tlc_raw.name}/tlc
              - --bronze-schema
              - ${resources.schemas.bronze.name}
              - --silver-schema
              - ${resources.schemas.silver_schema.name}
              - --gold-schema
              - ${resources.schemas.gold_schema.name}
              - --quality-schema
              - ${resources.schemas.quality_schema.name}
              - --start-month
              - "2023-01"
              - --end-month
              - "2023-05"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
